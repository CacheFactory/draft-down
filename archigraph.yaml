- id: bridge.scene
  kind: service
  layer: runtime
  name: Scene Bridge
  x:
    impl:
      language: TypeScript
      framework: Three.js
      complexity: moderate
      status: implemented
    docs:
      description: "Syncs geometry engine B-Rep → Three.js objects. Faces as THREE.Group\n\
        \          (DoubleSide meshes) in main scene with per-face PBR materials from MaterialManager.\n\
        \          Texture mapping uses face-local UV projection (tangent/bitangent from first edge) so\n\
        \          textures stick to faces when moved/rotated. Edges as THREE.Line in main scene (depth-tested).\n\
        \          Component bounding boxes as purple wireframe. Snap system: vertices, midpoints,\n\
        \          and edge-edge intersections. Texture cache for data URL → THREE.Texture.\n\
        \          Preview lines and snap markers non-raycastable (raycast=()=>{}).\n\
        \          Batched mode: syncBatched() merges all faces into single BufferGeometry for large\n\
        \          imports (>10K faces). Tracks batched face/edge IDs so sync() only processes NEW geometry.\n\
        \          GPU pick mesh with vertex-color-encoded face IDs (ShaderMaterial, per-face RGB).\n\
        \          Batched edges skip raycast. Edge creation skipped for >10K face imports (~375MB savings).\n\
        \          Dirty tracking: dual check using IFace.generation counter (bumped on material/topology\n\
        \          changes) and vertex position hashing (catches direct position mutations by move/rotate/scale\n\
        \          tools). Skips re-triangulation when both are clean. When updating highlighted faces,\n\
        \          detects swapped highlight material and updates renderer's saved original via\n\
        \          refreshHighlightOriginal() to prevent material loss on highlight restore."
  uuid: sBr1dg3X
- id: app.singleton
