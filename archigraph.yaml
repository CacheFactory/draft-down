- id: renderer.webgl
  kind: renderer
  layer: rendering
  name: WebGL Renderer
  x:
    renderer:
      engine: Three.js
      antialiasing: MSAA
      shadows: true
      postProcessing: SSAO, edge detection outlines, selection highlight glow
    perf:
      critical: true
      optimizations: Frustum culling, instanced rendering for components, LOD for distant objects, GPU picking for selection,
        batched geometry for draw call reduction, Earcut triangulation cache (reuse tri indices when face topology unchanged),
        in-place Float32Array buffer writes for faces and edges (skip geometry disposal/creation during transforms),
        dirty vertex tracking with vertex→face/edge adjacency for targeted sync iteration (O(dirty) not O(all)),
        deferred component bounding box updates (unit-box with scale transform, skip unaffected components)
      benchmarks: Target 60fps for models up to 500K faces, 30fps for models up to 2M faces
    impl:
      language: TypeScript
      framework: Three.js
      complexity: very-complex
      status: implemented
    docs:
      description: "Three.js WebGL renderer with ambient+directional+hemisphere lighting, logarithmicDepthBuffer,\n\
        \        and localClippingEnabled. Infinite shader-based ground grid. Face highlighting uses an\n\
        \        OVERLAY mesh approach (not material swap) — when a face is selected/pre-selected the\n\
        \        original textured material stays attached, and a translucent tinted overlay mesh sharing\n\
        \        the same geometry is added on top so the texture shows through the highlight tint. The\n\
        \        per-entity overlays are tracked in _faceHighlightOverlays and removed on un-highlight.\n\
        \        Edge highlighting still swaps the line material and adds a camera-distance-scaled glow\n\
        \        tube cylinder. Pre-selection=orange, selection=blue. Edge lines in main scene\n\
        \        (depth-tested against faces, polygonOffset on faces prevents z-fighting).\n\
        \        setSectionPlane() for real-time clipping. GPU picking: renders entity IDs as unique\n\
        \        colors to offscreen framebuffer via ShaderMaterial (bypasses Three.js color management).\n\
        \        Per-entity pick meshes for small models, vertex-color-encoded batched pick mesh for large\n\
        \        imported models. Pick buffer re-rendered only on camera move. Batched mode: syncBatched()\n\
        \        merges all faces into single BufferGeometry with frustumCulled=false, castShadow=false.\n\
        \        Edges >200K skipped. Batched face highlighting via temporary extracted geometry (same\n\
        \        overlay-on-top pattern). extractEdgeFromBatch() promotes batched edges to individual\n\
        \        lines for component editing. Memory optimizations: glow tube object pool, numeric camera\n\
        \        movement detection (no string allocation), reusable Vector2/Vector3/Color/Plane instances.\n\
        \        refreshHighlightOriginal() retained for the edge path so syncFace material updates while\n\
        \        an edge is highlighted survive the un-highlight.\n\
        \        Non-batched sync performance: _faceTriCache caches Earcut triangulation indices keyed on\n\
        \        face.generation + vertex count — reused when topology unchanged (move/scale/rotate). syncFace()\n\
        \        and syncEdge() write Float32Array position/normal/UV buffers in-place with needsUpdate=true,\n\
        \        skipping geometry disposal/creation. markVerticesDirty(ids) accepts dirty vertex IDs from tools;\n\
        \        resolveDirtyAdjacency() uses engine.getVertexFaces/getVertexEdgeIds to compute affected faces/edges,\n\
        \        reducing iteration from O(all faces) to O(dirty faces). Dirty tracking cleared after each sync().\n\
        \        Component visuals: syncComponentBoxes() draws bounding boxes (purple=normal, blue=editing),\n\
        \        uses unit-box with scale transform instead of allocating new BoxGeometry each frame,\n\
        \        skips components whose vertices don't overlap the dirty set.\n\
        \        syncComponentDimming() uses color tinting (lerp toward gray, 0.8 factor) on faces outside\n\
        \        the editing component — no transparency overhead. Edges outside get lightened color.\n\
        \        Restores original colors on exit. Separate _origColor (dimming) and _preTintColor\n\
        \        (selection tinting) prevent conflicts. tintComponentFaces() lerps selected component\n\
        \        faces toward blue (0.25 factor) for selection feedback without expanding entity IDs\n\
        \        through the highlight pipeline — major performance improvement for large components."
      notes: "## Typed Interface\n\n```typescript\nimport * as THREE from 'three';\nimport { EffectComposer } from 'three/examples/jsm/postprocessing/EffectComposer';\n\
        import { HalfEdgeMesh, GPUBufferData } from '../geometry/mesh';\nimport { ISceneManager, Group, ComponentInstance\
        \ } from '../data/scene';\nimport { ISelectionManager } from '../data/selection';\nimport { IMaterialManager, Material\
        \ } from '../data/materials';\nimport { InferenceGuide } from '../geometry/inference';\nimport { Camera } from '../rendering/camera';\n\
        \nexport type RenderMode = 'wireframe' | 'shaded' | 'textured' | 'rendered' | 'xray';\n\nexport interface RenderStats\
        \ {\n  fps: number;\n  frameTime: number; // ms\n  drawCalls: number;\n  triangles: number;\n  geometryMemory: number;\
        \ // bytes\n  textureMemory: number; // bytes\n}\n\nexport interface RenderOverlay {\n  inferenceGuides: InferenceGuide[];\n\
        \  selectionHighlights: string[]; // entity IDs\n  preselectionHighlight: string | null;\n  rubberBandGeometry: THREE.BufferGeometry\
        \ | null; // tool preview lines\n  gridVisible: boolean;\n  axesVisible: boolean;\n  sectionPlanes: SectionPlaneData[];\n\
        }\n\nexport interface SectionPlaneData {\n  plane: THREE.Plane;\n  active: boolean;\n  showFill: boolean;\n}\n\nexport\
        \ interface IRenderer {\n  // Setup\n  initialize(canvas: HTMLCanvasElement, width: number, height: number): void;\n\
        \  dispose(): void;\n  resize(width: number, height: number): void;\n\n  // Render loop\n  startRenderLoop(): void;\n\
        \  stopRenderLoop(): void;\n  requestFrame(): void; // force re-render\n  render(camera: Camera, overlay: RenderOverlay):\
        \ void;\n\n  // Scene sync\n  syncScene(sceneManager: ISceneManager): void; // rebuild Three.js scene from scene graph\n\
        \  syncMesh(meshId: string, mesh: HalfEdgeMesh): void; // update single mesh\n  syncMaterial(material: Material):\
        \ void; // update single material\n  syncSelection(selectionManager: ISelectionManager): void;\n\n  // Render mode\n\
        \  setRenderMode(mode: RenderMode): void;\n  getRenderMode(): RenderMode;\n\n  // Picking (GPU-accelerated)\n  pick(screenX:\
        \ number, screenY: number): PickResult | null;\n  pickRect(x1: number, y1: number, x2: number, y2: number): PickResult[];\n\
        \n  // Stats\n  getStats(): RenderStats;\n\n  // Configuration\n  setShadowsEnabled(enabled: boolean): void;\n  setAntialiasing(mode:\
        \ 'none' | 'FXAA' | 'MSAA' | 'SMAA'): void;\n  setBackgroundMode(mode: 'solid' | 'gradient' | 'environment'): void;\n\
        \  setEdgeRendering(enabled: boolean, color?: string, width?: number): void;\n}\n\nexport interface PickResult {\n\
        \  entityId: string;\n  entityType: 'vertex' | 'edge' | 'face' | 'group' | 'component_instance';\n  point: THREE.Vector3;\
        \ // world-space intersection point\n  normal: THREE.Vector3; // face normal at hit point\n  distance: number; //\
        \ camera distance\n  faceId?: string;\n  edgeId?: string;\n  vertexId?: string;\n}\n```\n\n## Render Pipeline (per\
        \ frame)\n1. Sync dirty geometry (check HalfEdgeMesh dirty flags → update THREE.BufferGeometry)\n2. Sync dirty materials\
        \ (check Material dirty flags → update THREE.MeshStandardMaterial)\n3. Depth pre-pass (for SSAO)\n4. Main color pass\
        \ (PBR materials via shader.pbr)\n5. Edge/outline pass (shader.outline — Sobel edge detection)\n6. Selection highlight\
        \ pass (shader.selection — stencil-based)\n7. SSAO pass\n8. Overlay pass (grid, axes, inference guides, rubber-band\
        \ lines, dimensions)\n9. Present to canvas\n\n## Instanced Rendering\nComponent instances that share a definition\
        \ use THREE.InstancedMesh. One draw call for all instances of the same component, with per-instance transform matrices."
  uuid: uJZVdiUn
