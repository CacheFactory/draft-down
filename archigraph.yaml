- id: data.materials
  kind: scene_manager
  layer: data
  name: Material Manager
  x:
    scene:
      hierarchy: flat
      layers: false
      groups: true
    impl:
      language: TypeScript
      complexity: moderate
      status: implemented
    docs:
      description: "Manages material definitions, procedural texture generation, and face assignments. Stores PBR
        material properties (color, roughness, metalness, opacity, albedoMap). Includes 11 built-in procedural textures
        (Brick, Wood, Concrete, Metal, Glass, Stone, Tile, Grass, Asphalt, Plaster, Roof Shingle) generated via canvas
        at startup. Face assignments are serialized for undo/redo snapshots alongside geometry state. Face material
        is resolved by faceId via faceAssignments (TrackedMap) — IFace.materialIndex is a parallel side-channel
        and NOT what SceneBridge reads. inheritAssignment(parentId, childIds) ports the keyed entry onto new face
        IDs after a split; wired to GeometryEngine.onFaceSplit in Application so a line bisecting a textured face
        keeps the texture on both halves."
      notes: "## Typed Interface\n\n```typescript\nimport { Color3, Vector2 } from '../math/types';\n\nexport interface TextureMap\
        \ {\n  filePath: string; // relative path to texture file\n  width: number;\n  height: number;\n  scale: Vector2;\
        \ // UV scale (tiling)\n  offset: Vector2; // UV offset\n  rotation: number; // UV rotation in radians\n  gpuTexture:\
        \ WebGLTexture | null; // cached GPU handle\n  imageData: ImageBitmap | null; // cached CPU image\n}\n\nexport interface\
        \ Material {\n  readonly id: string;\n  name: string;\n  // PBR properties\n  albedoColor: Color3; // base color (RGB\
        \ 0-1)\n  albedoTexture: TextureMap | null;\n  roughness: number; // 0 (mirror) to 1 (matte)\n  roughnessTexture:\
        \ TextureMap | null;\n  metalness: number; // 0 (dielectric) to 1 (metal)\n  metalnessTexture: TextureMap | null;\n\
        \  normalTexture: TextureMap | null;\n  opacity: number; // 0 (transparent) to 1 (opaque)\n  opacityTexture: TextureMap\
        \ | null;\n  // native\n  colorized: boolean; // tint texture with albedoColor\n  thumbnail: ImageBitmap |\
        \ null;\n}\n\nexport interface MaterialLibrary {\n  readonly id: string;\n  name: string;\n  materials: Material[];\n\
        \  filePath: string; // JSON file on disk\n}\n\nexport interface IMaterialManager {\n  // Material CRUD\n  createMaterial(name:\
        \ string, props?: Partial<Material>): Material;\n  deleteMaterial(material: Material): void;\n  updateMaterial(material:\
        \ Material, changes: Partial<Material>): void;\n  getMaterial(id: string): Material | undefined;\n  getAllMaterials():\
        \ Material[];\n  getDefaultMaterial(): Material; // white, no texture\n\n  // Texture loading\n  loadTexture(filePath:\
        \ string): Promise<TextureMap>;\n  unloadTexture(texture: TextureMap): void;\n\n  // Libraries\n  loadLibrary(filePath:\
        \ string): Promise<MaterialLibrary>;\n  saveLibrary(library: MaterialLibrary): Promise<void>;\n  getBuiltInLibraries():\
        \ MaterialLibrary[]; // wood, metal, glass, etc.\n\n  // Face assignment\n  assignToFace(face: Face, material: Material,\
        \ backMaterial?: Material): void;\n  sampleFromFace(face: Face): Material;\n  replaceAll(oldMaterial: Material, newMaterial:\
        \ Material): number; // returns count\n\n  // GPU sync\n  getThreeMaterial(material: Material): THREE.MeshStandardMaterial;\n\
        \  invalidateGPUMaterial(material: Material): void;\n\n  // Events\n  on(event: 'material-created' | 'material-changed'\
        \ | 'material-deleted' | 'library-loaded', handler: (data: any) => void): void;\n  off(event: string, handler: Function):\
        \ void;\n}\n```\n\n## Built-in Libraries\nShip with default material libraries: Colors (basic colors), Wood (oak,\
        \ pine, walnut), Metal (steel, aluminum, copper), Glass (clear, tinted, frosted), Concrete, Brick, Stone, Fabric.\
        \ Each library is a JSON file with embedded texture file references."
  uuid: m7eNPgOv
- id: engine.inference
  kind: geometry_engine
  layer: geometry
  name: Inference Engine
  x:
    geometry:
      precision: float64
      representation: B-Rep
    perf:
      critical: true
      optimizations: Spatial indexing for nearest-point queries, cached edge/face geometry for snap computation, frame-rate
        throttled inference updates
      benchmarks: Snap computation < 2ms per frame for models up to 100K edges
    impl:
      language: TypeScript
      complexity: very-complex
      status: implemented
    docs:
      description: Centralized inference engine — the core of native guided drawing. Runs every frame during tool
        operations to find snap targets and constraint guides.
      notes: "## Typed Interface\n\n```typescript\nimport { Vector3, Ray, Plane } from '../math/types';\nimport { Vertex,\
        \ Edge, Face } from '../geometry/mesh';\nimport { IGeometryEngine } from '../geometry/engine';\n\nexport type InferenceType\
        \ =\n  | 'endpoint' // green dot — vertex snap\n  | 'midpoint' // cyan dot — edge midpoint\n  | 'on-edge' // red dot\
        \ — point on edge\n  | 'on-face' // blue dot — point on face\n  | 'intersection' // black dot — edge-edge or edge-axis\
        \ intersection\n  | 'on-axis-x' // red line — constrained to X axis\n  | 'on-axis-y' // green line — constrained to\
        \ Y axis\n  | 'on-axis-z' // blue line — constrained to Z axis\n  | 'parallel' // magenta line — parallel to referenced\
        \ edge\n  | 'perpendicular' // magenta line — perpendicular to referenced edge\n  | 'from-point' // dotted line —\
        \ inference from a previously referenced point\n  | 'tangent'; // tangent to arc/circle\n\nexport interface InferenceResult\
        \ {\n  type: InferenceType;\n  point: Vector3; // the snapped-to 3D point\n  priority: number; // higher = stronger\
        \ snap (endpoint > on-edge > on-face)\n  referenceEntity: Vertex | Edge | Face | null; // what we snapped to\n  guideGeometry:\
        \ InferenceGuide[]; // visual guides to draw\n  tooltip: string; // 'Endpoint', 'On Edge', 'Midpoint', etc.\n  color:\
        \ string; // guide color (#FF0000 for X axis, etc.)\n}\n\nexport interface InferenceGuide {\n  type: 'point' | 'line'\
        \ | 'dashed-line' | 'arc';\n  points: Vector3[]; // [center] for point, [start, end] for line\n  color: string;\n\
        \  size: number; // dot size or line width in pixels\n}\n\nexport interface InferenceContext {\n  toolStartPoint:\
        \ Vector3 | null; // where the current tool operation started\n  recentPoints: Vector3[]; // recently clicked/referenced\
        \ points (for from-point inference)\n  recentEdges: Edge[]; // recently referenced edges (for parallel/perpendicular)\n\
        \  lockedAxis: 'x' | 'y' | 'z' | null; // arrow key axis lock\n  lockedPlane: Plane | null; // face plane lock\n \
        \ customAxes: { origin: Vector3; xAxis: Vector3; yAxis: Vector3; zAxis: Vector3 } | null;\n}\n\nexport interface InferenceConfig\
        \ {\n  snapRadius: number; // screen pixels — default 15\n  axisSnapAngle: number; // degrees deviation to snap to\
        \ axis — default 5\n  pointPriority: number; // endpoint/midpoint priority — default 100\n  edgePriority: number;\
        \ // on-edge priority — default 50\n  facePriority: number; // on-face priority — default 10\n  axisPriority: number;\
        \ // axis constraint priority — default 75\n  enabled: boolean;\n}\n\nexport interface IInferenceEngine {\n  // Main\
        \ query — called every frame during tool operation\n  findInference(\n    screenPos: { x: number; y: number },\n \
        \   ray: Ray, // 3D ray from camera through screen point\n    context: InferenceContext,\n    config?: Partial<InferenceConfig>\n\
        \  ): InferenceResult | null;\n\n  // Batch query — find all inferences sorted by priority\n  findAllInferences(\n\
        \    screenPos: { x: number; y: number },\n    ray: Ray,\n    context: InferenceContext\n  ): InferenceResult[];\n\
        \n  // Specific snap tests\n  snapToPoint(ray: Ray, candidates: Vertex[], screenRadius: number): InferenceResult |\
        \ null;\n  snapToEdge(ray: Ray, candidates: Edge[], screenRadius: number): InferenceResult | null;\n  snapToFace(ray:\
        \ Ray, candidates: Face[]): InferenceResult | null;\n  snapToAxis(point: Vector3, origin: Vector3, axes: Vector3[]):\
        \ InferenceResult | null;\n  snapToParallel(point: Vector3, direction: Vector3, referenceEdge: Edge): InferenceResult\
        \ | null;\n  snapToPerpendicular(point: Vector3, direction: Vector3, referenceEdge: Edge): InferenceResult | null;\n\
        \n  // Configuration\n  setConfig(config: Partial<InferenceConfig>): void;\n  getConfig(): InferenceConfig;\n}\n```\n\
        \n## Inference Pipeline (per frame)\n1. Cast ray from camera through cursor position\n2. Spatial query: get all vertices/edges/faces\
        \ within snap radius (screen space)\n3. Test point snaps: endpoint, midpoint, intersection (highest priority)\n4.\
        \ Test edge snaps: on-edge, perpendicular, parallel\n5. Test face snaps: on-face\n6. Test axis constraints: X/Y/Z\
        \ axis from start point\n7. Test from-point inferences: lines from recently referenced points\n8. Rank all results\
        \ by priority + distance\n9. Return best result + guide geometry for rendering\n\n## Performance Budget\nMust complete\
        \ in < 2ms per frame for models up to 100K edges. Uses spatial index (octree) for candidate collection. Caches screen-space\
        \ projections of nearby geometry."

  uuid: Eqy9cs0S
- id: test.e2e.tools
  kind: test_suite
  layer: testing
  name: Tool E2E Tests
  x:
    test:
      type: e2e
      framework: Playwright
      ci: true
      timeout: 30000
      coverage: 'All interactive tools: select, line, rectangle, circle, arc, polygon, push/pull, move, rotate, scale, offset,
        eraser, paint, orbit, pan, zoom, tape measure, protractor, dimension, text, follow me, solid tools, section plane.
        Tests complete workflows from tool activation through geometry creation to undo.'
      fixtures: Empty scene, pre-built cube model, pre-built house model, multi-component scene
    impl:
      language: TypeScript
      complexity: very-complex
      status: spec-only
    docs:
      description: End-to-end Playwright tests for all interactive tools. Launches Electron app and tests complete user workflows.
      notes: "## Typed Interface\n\n```typescript\nimport { test, expect, ElectronApplication, Page } from '@playwright/test';\n\
        \n// ========== Test Helpers ==========\n\nexport interface ViewportHelper {\n  // Mouse interactions on the 3D viewport\
        \ canvas\n  clickAt(x: number, y: number): Promise<void>;\n  doubleClickAt(x: number, y: number): Promise<void>;\n\
        \  dragFrom(x1: number, y1: number, x2: number, y2: number): Promise<void>;\n  scrollAt(x: number, y: number, delta:\
        \ number): Promise<void>;\n  middleDragFrom(x1: number, y1: number, x2: number, y2: number): Promise<void>;\n\n  //\
        \ Tool activation\n  activateTool(toolId: string): Promise<void>;\n  pressShortcut(key: string): Promise<void>;\n\
        \  typeVCB(value: string): Promise<void>;\n\n  // Geometry assertions (via IPC to renderer)\n  getVertexCount(): Promise<number>;\n\
        \  getFaceCount(): Promise<number>;\n  getEdgeCount(): Promise<number>;\n  getEntityCount(type: string): Promise<number>;\n\
        \  getSelectionCount(): Promise<number>;\n  getSelectedIds(): Promise<string[]>;\n  getMeshBoundingBox(): Promise<{\
        \ min: number[]; max: number[] }>;\n}\n\nexport interface AppHelper {\n  electronApp: ElectronApplication;\n  page:\
        \ Page;\n  viewport: ViewportHelper;\n\n  // Setup\n  launch(): Promise<void>;\n  close(): Promise<void>;\n  newDocument():\
        \ Promise<void>;\n  loadFixture(name: string): Promise<void>;\n\n  // Assertions\n  expectToolActive(toolId: string):\
        \ Promise<void>;\n  expectUndoAvailable(available: boolean): Promise<void>;\n  expectRedoAvailable(available: boolean):\
        \ Promise<void>;\n  expectDirty(dirty: boolean): Promise<void>;\n}\n```\n\n## Test Scenarios\n\n### Drawing Tool Tests\n\
        ```typescript\ntest.describe('Line Tool', () => {\n  test('draw a single line', async ({ app }) => {\n    await app.viewport.activateTool('tool.line');\n\
        \    await app.viewport.clickAt(400, 300); // start point\n    await app.viewport.clickAt(600, 300); // end point\n\
        \    await app.viewport.pressShortcut('Escape'); // finish\n    expect(await app.viewport.getEdgeCount()).toBe(1);\n\
        \    expect(await app.viewport.getVertexCount()).toBe(2);\n  });\n\n  test('draw rectangle creates face', async ({\
        \ app }) => {\n    // draw 4 lines forming closed loop\n    await app.viewport.activateTool('tool.line');\n    await\
        \ app.viewport.clickAt(300, 300);\n    await app.viewport.clickAt(500, 300);\n    await app.viewport.clickAt(500,\
        \ 500);\n    await app.viewport.clickAt(300, 500);\n    await app.viewport.clickAt(300, 300); // close loop\n    expect(await\
        \ app.viewport.getFaceCount()).toBe(1);\n  });\n\n  test('VCB input sets exact length', async ({ app }) => {\n   \
        \ await app.viewport.activateTool('tool.line');\n    await app.viewport.clickAt(400, 300);\n    await app.viewport.typeVCB('1000');\
        \ // 1000mm\n    // verify edge length matches\n  });\n\n  test('undo removes last edge', async ({ app }) => {\n \
        \   await app.viewport.activateTool('tool.line');\n    await app.viewport.clickAt(400, 300);\n    await app.viewport.clickAt(600,\
        \ 300);\n    await app.viewport.pressShortcut('Escape');\n    expect(await app.viewport.getEdgeCount()).toBe(1);\n\
        \    await app.viewport.pressShortcut('Control+z');\n    expect(await app.viewport.getEdgeCount()).toBe(0);\n  });\n\
        });\n```\n\n### Push/Pull Tests\n```typescript\ntest.describe('Push/Pull Tool', () => {\n  test('extrude face creates\
        \ solid', async ({ app }) => {\n    await app.loadFixture('unit-rectangle'); // flat rectangle face\n    await app.viewport.activateTool('tool.pushpull');\n\
        \    await app.viewport.clickAt(400, 350); // click face\n    await app.viewport.dragFrom(400, 350, 400, 200); //\
        \ drag up\n    expect(await app.viewport.getFaceCount()).toBe(6); // box = 6 faces\n  });\n\n  test('double-click\
        \ repeats last distance', async ({ app }) => {\n    await app.loadFixture('two-rectangles');\n    await app.viewport.activateTool('tool.pushpull');\n\
        \    // extrude first face\n    await app.viewport.clickAt(300, 350);\n    await app.viewport.typeVCB('500');\n  \
        \  // double-click second face\n    await app.viewport.doubleClickAt(500, 350);\n    // both should be extruded by\
