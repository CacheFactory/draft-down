      description: 'GeometryEngine.onFaceSplit(parentId, childIds) callback fires from splitFaceAtBoundary after children
        are created. Application wires it to MaterialManager.inheritAssignment so faceId-keyed face material assignments
        carry over when a face is bisected. Necessary because the renderer reads materials via faceAssignments[faceId],
        not IFace.materialIndex — without this hook the new faces lose their texture.'
  uuid: eGeoMatSplit

