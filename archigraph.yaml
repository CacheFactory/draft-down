- id: op.extrude
  kind: operation
  layer: modeling
  name: Extrude (Push/Pull)
  x:
    operation:
      type: extrude
      destructive: true
      preview: true
    perf:
      critical: true
    impl:
      language: TypeScript
      complexity: very-complex
      status: implemented
    docs:
      description: Core push/pull extrusion operation — the heart of DraftDown modeling. Takes a planar face and a distance,
        creates new side faces connecting the original boundary to a translated copy.
      notes: "## Typed Interface\n\n```typescript\nimport { Operation, OperationParams, OperationResult } from '../types/operation';\n\
        import { Face, Edge, Vertex, HalfEdgeMesh } from '../geometry/mesh';\nimport { Vector3 } from '../math/types';\nimport\
        \ { SolidEngine } from '../geometry/solid';\n\nexport interface ExtrudeParams extends OperationParams {\n  face: Face;\
        \ // the face to extrude\n  distance: number; // positive = along normal, negative = against\n  direction?: Vector3;\
        \ // override face normal\n  createNewStartFace: boolean; // Ctrl mode: leave original face behind\n  autoBooleanCut:\
        \ boolean; // detect and perform boolean subtraction\n}\n\nexport interface ExtrudeResult extends OperationResult\
        \ {\n  newFaces: Face[]; // all newly created faces (sides + cap)\n  capFace: Face; // the translated copy of the\
        \ original face\n  sideFaces: Face[]; // faces connecting original boundary to cap\n  newEdges: Edge[];\n  newVertices:\
        \ Vertex[];\n  removedFaces: Face[]; // faces consumed by boolean cut\n  wasBooleanCut: boolean;\n}\n\nexport interface\
        \ ExtrudeDelta {\n  // For undo system — minimal diff to reverse this operation\n  addedVertices: { id: string; position:\
        \ Vector3 }[];\n  addedEdges: { id: string; v1: string; v2: string }[];\n  addedFaces: { id: string; loop: string[]\
        \ }[];\n  removedFaces: { id: string; loop: string[]; material: string }[];\n  movedVertices: { id: string; from:\
        \ Vector3; to: Vector3 }[];\n}\n\nexport class ExtrudeOperation implements Operation {\n  readonly id = 'op.extrude';\n\
        \  readonly type = 'extrude';\n  readonly destructive = true;\n\n  execute(mesh: HalfEdgeMesh, params: ExtrudeParams):\
        \ ExtrudeResult;\n  preview(mesh: HalfEdgeMesh, params: ExtrudeParams): ExtrudeResult; // non-destructive preview\n\
        \  undo(mesh: HalfEdgeMesh, delta: ExtrudeDelta): void;\n  redo(mesh: HalfEdgeMesh, delta: ExtrudeDelta): void;\n\n\
        \  // Internal\n  private createSideFaces(boundary: Edge[], normal: Vector3, distance: number): Face[];\n  private\
        \ cloneAndTranslateFace(face: Face, offset: Vector3): Face;\n  private mergeCoplanarFaces(mesh: HalfEdgeMesh, newFaces:\
        \ Face[]): void;\n  private detectBooleanCutNeeded(face: Face, direction: Vector3, distance: number, mesh: HalfEdgeMesh):\
        \ boolean;\n  private performBooleanCut(face: Face, distance: number, solid: SolidEngine): ExtrudeResult;\n}\n```\n\
        \n## Algorithm Detail\n1. Get ordered boundary edges of face: `face.getOuterLoop()` → `HalfEdge[]`\n2. For each boundary\
        \ vertex, create a new vertex at `vertex.position + normal * distance`\n3. For each boundary edge (v1→v2), create\
        \ a quad side face: (v1, v2, v2_new, v1_new)\n4. Create cap face from all new vertices in same winding order as original\n\
        5. Update half-edge connectivity: side face half-edges link to cap and original\n6. If `createNewStartFace`: keep\
        \ original face, else original face becomes part of the solid\n7. Run `mergeCoplanarFaces` to clean up coplanar adjacencies\n\
        8. Return delta for undo system"


