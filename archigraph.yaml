- id: core.units
  kind: service
  layer: system
  name: Unit System & Distance Parsing
  x:
    impl:
      language: TypeScript
      complexity: simple
      status: implemented
    docs:
      description: |
        src/core/units.ts — internal unit is METERS everywhere; display/input
        conversion happens only at the VCB boundary. Singleton current unit
        (setCurrentUnit/getCurrentUnit, updated from preferences).
        parseDistanceExpr(): classic-CAD-style VCB distance grammar — unit
        suffixes (' or ft/feet, " or in/inch/inches, mm, cm, m; longest-match,
        case-insensitive), feet+inches combos (8'10", and a bare number after
        a feet term means inches: 8'10), fractions (1/2", 3/8, mixed 10 1/2"),
        additive multi-term expressions (1m 20cm), signs, NaN on trailing
        garbage (so 24s segment-count syntax never parses as a distance).
        BaseTool.parseDistance/parseDimensions route ALL tool VCB input
        through it; a bare number uses the current document unit. Angles
        (rotate/protractor) use plain parseFloat — no length conversion.
  uuid: sCoreUnit
