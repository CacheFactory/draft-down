        \ (draw, measure, construct, active modify, axes). The snap\n          kind is delivered to tools on ToolMouseEvent.snapKind\
        \ ('origin' | 'vertex' | 'midpoint' |\n          'intersection' | 'edge' | 'face' | 'cursor'). Markers: green ring+dot endpoint/origin,\
        \ cyan midpoint,\n          dark intersection, red on-edge, yellow square face-snap, blue dot free cursor.\n          ViewportCanvas\
        \ renders a convention-named label near the cursor (Origin/Endpoint/Midpoint/Intersection/On\n          Edge/On Face) for all snapping\
        \ tools; a tool's directional inference label (getInferenceLabel())\n          overrides it. BaseTool.applyDirectionInference()\
        \ adds automatic axis inference (On Red/Green/Blue\n          Axis, colored guide line + rubber band, ~7° tolerance, Shift pins\
        \ the inference) and\n          parallel-to-edge inference (magenta), shared by Line, Move, and Tape Measure tools.\n         \
        \ Hard point snaps always beat directional inference.\n          INVARIANT — indicator == geometry: tools sizing a shape on a locked\
        \ drawing plane\n          (rectangle 2nd corner, circle/polygon radius, arc end/bulge/center points) resolve the\n\
        \          point via BaseTool.getPlanePointHonoringSnap(): a hard point snap (origin/vertex/\n\
        \          midpoint/intersection/on-edge) wins and is projected onto the plane; otherwise the\n\
        \          cursor is raycast onto the plane. Face/cursor snaps are surfaces, not points, and\n\
        \          don't override the raycast. A raw raycastOntoPlane here diverges from the shown\n\
        \          snap marker — that bug class placed corners a few pixels off snapped endpoints.\n\
        \          Rectangle applies the SAME proportion inference (Square/Golden Section) at commit\n\
        \          as in the preview; a hard snap suppresses it."
  uuid: sSnpSys1
- id: system.autoface
  kind: service
  layer: geometry
  name: Auto-Face Creation
  x:
    impl:
      language: TypeScript
      complexity: moderate
      status: implemented
    docs:
      description: |
        Four auto-face mechanisms in GeometryEngine:
        (1) autoCreateFaces via createEdgeWithAutoFace(): BFS finds short closed coplanar loops
        through existing edges. Hard caps prevent exponential blow-up: maxDepth=8
        (down from 20), maxExplore=5000 dequeues, maxLoopsFound=200. Real face loops are
        short; depth 20 caused 6^20 path enumeration on dense graphs (e.g. imported stair
        components). Coplanarity tolerance is 0.05 (practical for hand-drawn geometry).
        Three loop-rejection checks: chord detection (edges between non-adjacent loop
        vertices), loopContainsInteriorVertex (2D point-in-polygon rejects loops enclosing
        other coplanar vertices with edges; plane normal via Newell's method — a cross
        product of the first three loop vertices is zero when they are collinear, which
        silently skipped the check and stacked overlapping faces. An interior vertex only
        disqualifies when it is enclosed STRUCTURE: a path crossing the loop with ≥2
        boundary contacts, a cycle, or face-bearing edges — a dangling tree with ≤1
        contact does not; classic CAD forms the face under a dangling edge), AND
        loopPartiallyOverlapsExistingFace (rejects loops that straddle an existing coplanar
        face's boundary — some vertices strictly inside, some outside, or edges properly
        crossing it. Fully-enclosed loops still pass and punch holes via cutHoleIfEnclosed).
        (2) splitFaceWithEdge: splits face when edge connects two non-adjacent boundary vertices.
        (3) splitFaceWithPath(): splits face along multi-vertex path (arc). Scans
        full chain to find first/last vertices on face boundary (handles lines extending
        beyond the face). Handles endpoints ON face edges via proximity detection
        (0.05 threshold), vertex insertion with modular indexing for wrapping edges
        (shared helper insertOnBoundaryVertices), and edge splitting. Both
        resulting faces include arc vertices on shared boundary (no chord edge).
        (4) splitFacesWithClosedRing(): classic CAD coplanar-merge for closed shape outlines.
        Expands the drawn corner ring with existing on-segment vertices (the intersection
        vertices createEdgeWithIntersection made), classifies each ring vertex per face as
        on-boundary / strictly-inside / outside, and splits every crossed face along
        boundary→interior→boundary runs (plus interior-crossing chords), iterating until
        stable. Ring vertices OUTSIDE a face are never treated as split paths (the old
        per-rotation splitFaceWithPath hack did, corrupting faces). Finishes by re-running
        autoCreateFaces per ring segment so regions outside the crossed faces form.
        Returns the split count; 0 lets circle/polygon tools safely createFace the full ring.
        Material/UV inheritance: child faces inherit the parent's materialIndex
        and reconstructed UVs (affine 3-point fit on the parent's plane); the engine
        fires onFaceSplit so MaterialManager carries the faceId-keyed material assignment
        onto the new IDs.
        Guards: no self-edges, no zero-length edges, no degenerate faces (< 3 unique vertices).
        Arc tool uses plain createEdge + splitFaceWithPath. Line tool uses createEdgeWithAutoFace.
        Rectangle/Circle/Polygon use createEdgeWithIntersection + splitFacesWithClosedRing.
  uuid: sAutFce1
- id: system.undo
  kind: service
  layer: data
  name: Snapshot Undo/Redo
  x:
    impl:
      language: TypeScript
      complexity: moderate
      status: implemented
    docs:
      description: 'Delta-based undo/redo system. TrackedMap intercepts all mutations on mesh entity maps (vertices,
        edges, faces, halfEdges) and material faceAssignments. Each transaction records add/delete/modify deltas.
        Undo applies inverse deltas in reverse order. Move/rotate/scale tools use snapshotVertices() for direct
        position mutations. ModelDocument re-wires setTrackedSources() after newDocument() and deserialize()
        since geometry.deserialize() replaces the internal HalfEdgeMesh.
        INVARIANT: a delete delta records the entity''s PRE-TRANSACTION state (the get()-time beforeSnapshot),
        NOT its delete-time state. An entity mutated then deleted in one transaction (a face whose boundary
        gained intersection vertices before a split deleted it) must be restored without those mutations —
        the vertices they reference are removed by the same undo. Recording delete-time state left restored
        faces pointing at missing vertices (the circle type-to-redo corruption: commit → undo → redraw).
        Redo is unaffected: forward delta application only uses the recorded value for add deltas.'
  uuid: sUndoSys
