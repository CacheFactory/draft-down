- id: system.face_snap
  kind: service
  layer: interaction
  name: On-Face Drawing Snap
  x:
    impl:
      language: TypeScript
      complexity: moderate
      status: implemented
    docs:
      description: 'native "On Face" inference. When a draw tool''s cursor hovers a face,
        ViewportCanvas (a) tracks the underlying face id separately from the component-resolved
        hitEntityId, and (b) projects the cursor ray onto that face''s plane to give the tool an
        exact on-face world point. SceneBridge.findSnapPoint shows a yellow square indicator
        (oriented to the face normal, lifted slightly toward the camera) when no higher-priority
        snap fires. BaseTool.getEffectiveDrawingPlane prefers the hit face''s plane so shape
        tools (Rectangle/Circle/Polygon/Arc) lock their drawing plane to the face on first
        click; subsequent moves use raycastOntoPlane(this.drawPlane, ...) so the cursor stays
        on the face plane regardless of where it strays. The Line tool has a parallel mechanism
        via lockedFacePlane. BaseTool.getEventNeeds returns raycast=true for draw/measure/construct
        tools in ALL phases (including idle), so the FIRST click on a face populates hitFaceId
        even when the snap pulls the point onto a vertex/edge — otherwise the shape would lock
        to the ground/axis plane instead of the face. RectangleTool.getPlaneAxes() builds in-plane
        axes (cross of normal with the world axis least parallel to it, then a second cross) for
        non-axis-aligned planes so all four computed corners stay on the locked plane — earlier
        code used world axes which only worked for axis-aligned drawing planes. createFace then
        runs cutHoleIfEnclosed, which punches a matching hole in the host face — and SceneBridge.sync
        was widened to re-triangulate any face whose generation bumped (the host face) so the hole
        renders instead of z-fighting. The renderer also exposes SceneBridge.getLastSnapKind() so
        ViewportCanvas can render a small floating label ("Point" / "Line" / "Face") near the
        cursor for draw-category tools.'
  uuid: sFaceSnp1
