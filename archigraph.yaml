- id: data.history
  kind: history
  layer: data
  name: Undo/Redo Manager
  x:
    history:
      maxSteps: 100
      persistent: false
    impl:
      language: TypeScript
      complexity: complex
      status: implemented
    docs:
      description: Delta-based undo/redo system. Each transaction records only what changed (add/delete/modify
        deltas on mesh entity maps and material face assignments) rather than serializing the full geometry state.
        TrackedMap subclasses intercept mutations on vertices, edges, faces, halfEdges, and faceAssignments.
        Undo applies inverse deltas in reverse order; redo applies forward deltas. O(1) begin/commit for most
        operations. Move/rotate/scale tools use snapshotVertices() for direct position mutations. ModelDocument
        re-wires setTrackedSources() after any geometry.deserialize() call that replaces the internal mesh.
        Dimension undo/redo via DimensionDelta snapshots (serializable, no Three.js objects) — setDimensionHandlers()
        registers getSnapshot/onRestore callbacks. Guide line undo/redo via GuideLineDelta — setGuideLineHandler()
        registers add/remove callback. Both are stored on DeltaTransaction and applied during undo/redo.
      notes: "## Key Files\n- `DeltaRecorder.ts` — DeltaOp type, DeltaRecorder class, GuideLineDelta interface,\
        \ entity clone helpers\n\
        - `TrackedMap.ts` — Map subclass that intercepts get/set/delete/iteration to capture deltas\n- `HistoryManager.ts`\
        \ — Transaction lifecycle, applyInverse/applyForward, vertex snapshots, DimensionDelta interface,\
        \ dimension/guide line snapshot and restore callbacks\n\n## Design Decisions\n- **Delta-based**:\
        \ Each transaction stores only changed entities (~KB), not full mesh snapshots (~57MB for large models).\n\
        - **TrackedMap instrumentation**: Intercepts set(), delete(), get(), forEach(), entries(), values(),\
        \ and [Symbol.iterator]() to capture before-snapshots on first access during a transaction.\n- **Deferred\
        \ flush**: Add deltas are deferred to flushDeltas() at commit time to capture final entity state after\
        \ in-place mutations (e.g., half-edge next/prev linking).\n- **Direct mutation support**: Move/rotate/scale\
        \ tools write v.position.x/y/z directly; snapshotVertices() captures before-state, commit diffs against\
        \ current.\n- **Lookup rebuild**: vertexToHalfEdges and edgeToHalfEdges are derived state, rebuilt via\
        \ rebuildLookups() after undo/redo.\n- **Bulk import bypass**: bulkAdd() uses Map.prototype.set to skip\
        \ recording during file import.\n- **Transaction grouping**: Complex operations wrapped in single transaction.\n\
        - **Redo invalidation**: New action after undo clears redo stack.\n- **Max steps**: Default 100 transactions."
  uuid: sF6Q1SXe
